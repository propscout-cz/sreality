name: "CI: build Chrome extension"

# Builds the chrome-extension/ bundle and uploads two workflow artifacts:
#   chrome-extension-dist   dist/ as built: keeps the pinned manifest `key`, so a
#                           "Load unpacked" install has the fixed dev ID
#   chrome-extension-store  the store package (release/package.ts): no `key`, no
#                           source maps, checked against release/allowed.ts
# The store-package step runs on every pull request, so a PR that adds a
# permission, a portal site or a host permission fails here until
# chrome-extension/release/allowed.ts says so too.
#
# Secrets required on the repository:
#   EXT_API_BASE_URL       →  same value as the Railway FastAPI URL
#   EXT_SUPABASE_URL       →  same value as VITE_SUPABASE_URL on the SPA
#   EXT_SUPABASE_ANON_KEY  →  same value as VITE_SUPABASE_ANON_KEY on the SPA
# Add them at Settings → Secrets and variables → Actions → New
# repository secret. The build inlines them into the bundle at build
# time (Path 1 — see chrome-extension/README.md). Wave 1: the extension
# runs its own PKCE session against Supabase GoTrue, so it no longer
# carries a static API bearer token (EXT_API_TOKEN, retired).

on:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      # The extension imports modules from the SPA tree (brand, portal ids, the
      # MF shape rule, and more to come) — a glob, not a hand list, so a new
      # import can't slip past the rail (mfReference.ts did).
      - 'frontend/src/lib/**'
      - 'frontend/src/styles/**'
      - '.github/workflows/build-extension.yml'
  pull_request:
    paths:
      - 'chrome-extension/**'
      - 'frontend/src/lib/**'
      - 'frontend/src/styles/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # 22.18+ runs the unit tests' .ts files natively (`node --test`, type stripping).
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Empty fallbacks let PRs from forks (no secret access) still
          # build the bundle — the runtime warns on startup and the
          # operator sees a clear "API base URL not configured" message.
          VITE_API_BASE_URL: ${{ secrets.EXT_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.EXT_SUPABASE_ANON_KEY }}
          # SPA base URL for the "Otevřít v aplikaci" link. Optional — empty → link hidden.
          VITE_APP_BASE_URL: ${{ secrets.EXT_APP_BASE_URL }}
      - name: Stamp build metadata
        run: |
          cat > dist/build-info.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Store package (checked against release/allowed.ts)
        run: npm run package
        env:
          # The build's own hosts, which the manifest must never name.
          VITE_API_BASE_URL: ${{ secrets.EXT_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          VITE_APP_BASE_URL: ${{ secrets.EXT_APP_BASE_URL }}
      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist
          path: chrome-extension/dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload store package
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-store
          path: chrome-extension/store
          if-no-files-found: error
          retention-days: 30
