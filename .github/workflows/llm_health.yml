name: "Monitoring: acute health (hourly)"

# The hourly lane of the health-check harness (scripts/verify_pipeline.py): it projects the
# check registry into health_checks, measures every check that is due by its own cadence,
# stores each result, and exits non-zero when an alarm reads Problem (`fail`), so GitHub
# emails the operator. GitHub throttles this cron to about five runs a day, so "hourly" is a
# ceiling, not a rate. The 6-hourly lane (verify_pipeline.yml) is identical, exit flag
# included, so a failing alarm measured by either lane reds that run and emails; both fold
# into one canary in wave 2. Telling is the API's: its ladder
# (toolkit/system_alerts.reconcile) turns the stored results into incidents and notices.
#
# Both lanes share one concurrency group, so a check is measured once per cadence even when
# GitHub delivers the two together. A gauge never reds this run: it is a standing condition
# the ladder tells once a day. A dispatch from a branch other than main measures but never
# projects the registry.
#
# Read-only apart from its own result and registry rows; needs ONLY SUPABASE_DB_URL —
# deliberately not the Anthropic key, so it keeps working when the API is what is down.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-verification
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Every check can be due at once (the first run after a deploy): the registry's summed
    # budgets plus headroom must fit (test_every_lane_budget_fits_its_job).
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the due health checks (red on a failing alarm)
        run: python -m scripts.verify_pipeline --exit-nonzero-on-fail
