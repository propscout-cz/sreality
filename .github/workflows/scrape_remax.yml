name: "Scraping: RE/MAX scraper (pilot)"

# Scheduled (every 6h) + manual scraper for remax-czech.cz on the shared portal
# framework. RE/MAX is a national franchise catalogue (~7,900 listings) served as
# a single server-rendered search index (no JSON API, no per-category URL) split
# only by an offer-type flag (sale=1 prodej / sale=2 pronájem): the index walk
# pages each agenda and enqueues new/price-changed ids into listing_detail_queue,
# then the detail drain fetches each /reality/detail/{id}/ page, parses to a
# ScrapedListing, and writes via listing_write.write_listings (the one listing
# write; new rows land property_id NULL and the straggler-attach births the singleton).
#
# WALK ONLY (--index-only, Actions exit W1, #2021): the realtime worker's drain lane fetches what
# the walk enqueues, as it already did for nearly every row (2026-10-23..25: 98% of this
# portal's completions landed outside these runs), so this job no longer drains.
# The per-listing category comes from the parser ("Typ
# nemovitosti" + title verb); the index walk slices each agenda by the card title
# for the Health reconciliation labels (migration 135).
#
# A PILOT: supports_complete_walk=false, so the runner never marks listings
# inactive from index-absence (architectural rule #3); a gone detail (404/410 or
# a redirect off the detail path) still flips that one listing inactive.
#
# Writes an 'index' scrape_runs row under source='remax' (its own
# Health-page lane; does not touch sreality liveness / reconciliation).
#
# Required secret: SUPABASE_DB_URL. (Coordinates come from each card's / detail
# page's data-gps, so no MAPY_CZ_API_KEY is needed. Image bytes are downloaded
# separately by the realtime worker's images lane.)

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: cap search pages walked per agenda (ad-hoc partial). Blank = full walk.
        required: false
        default: ""
        type: string
      max_seconds:
        description: wall-clock budget for the walk (seconds)
        required: false
        default: "2100"
        type: string

concurrency:
  group: remax-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The timeout must FIT the walk's own --max-seconds budget + setup: the walk
    # (392 pages @ 1/s) took 8-9 min, 2026-10-12..25. A too-small timeout SIGKILLs
    # it: finalize never runs (the scrape_runs row stuck open until the API-boot
    # sweep stamps it hours later -> phantom 722-min "durations").
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run remax scrape
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # W2a payload archive: bodies live in R2, so a page-fetching lane needs the
          # bucket to archive one. Absent, the append warns and archives NOTHING while
          # the scrape stays green. Inert until payload_dual_write is enabled.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_SECONDS: ${{ inputs.max_seconds || '2100' }}
        run: |
          ARGS="--index-only --max-seconds $MAX_SECONDS"
          if [ -n "$MAX_PAGES" ]; then ARGS="$ARGS --max-pages $MAX_PAGES"; fi
          echo "python -m scraper.remax_main $ARGS"
          # exec: a cancel's SIGINT must reach Python, which finalizes the run (#2019), not the shell around it.
          eval "exec python -m scraper.remax_main $ARGS"
