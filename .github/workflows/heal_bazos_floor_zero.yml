name: "Ops: heal bazos/web flats whose floor is 0 but whose text names a storey"

# The one-off heal that rides PR #2054 (scraper/floor.py: a stray "přízemí" anywhere in the
# text used to set floor 0). `scripts/heal_bazos_floor_zero.py` selects source in
# ('bazos','web'), category_main='byt', floor = 0 whose description names an above-ground
# storey, and writes the fixed parser's reading when it is above 0, otherwise NULL — a
# column-only compare-and-set on floor = 0 that enqueues `dirty_properties` in the same
# statement, never snapshots and never touches `last_seen_at` (rules 2 and 20; ledgered in
# tests/scraper/test_listing_write_census.py).
#
# dry_run=true (the default) prints counts and examples and writes nothing. The real write
# needs dry_run=false AND confirm=APPLY; the script refuses --apply without --backup, and the
# JSON backup of (id, old_floor, new_floor) is uploaded as a run artifact before anything else
# can go wrong. Every healed ad is re-decided by the dedup engine (its fp_digest moves), so run
# it outside a dedup rollout window.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report what would change only. false = write (needs confirm=APPLY)."
        required: false
        default: true
        type: boolean
      confirm:
        description: Type APPLY to arm the real write. Ignored when dry_run=true.
        required: false
        default: ""
        type: string

concurrency:
  group: heal-bazos-floor-zero
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Guard the real write
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::dry_run=false requires confirm=APPLY"
            exit 1
          fi

      - name: Heal
        env:
          IN_DRY_RUN: ${{ inputs.dry_run }}
          BACKUP: heal_bazos_floor_zero_${{ github.run_id }}.json
        run: |
          set -euo pipefail
          if [ "$IN_DRY_RUN" = "true" ]; then
            python -m scripts.heal_bazos_floor_zero
          else
            python -m scripts.heal_bazos_floor_zero --apply --backup "$BACKUP"
          fi

      - name: Keep the backup
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: heal-bazos-floor-zero-backup
          path: heal_bazos_floor_zero_*.json
          retention-days: 90
          if-no-files-found: error
