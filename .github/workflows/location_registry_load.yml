name: "Location: RÚIAN registry load"

# The monthly RÚIAN registry load (design 04 §4.4.2): ONE `full` load per vintage, 1st 10:00
# UTC. It HEAD-probes the vintage, archives both CSV zips AND the 253 MB state SHP boundary
# pack to R2, then stage -> blocking assertions -> merge -> boundaries (three geometries per
# unit, an unchanged unit's authoritative row carried from the previous version) -> gazetteer
# -> completeness assertion -> pointer swap into ONE new registry_version. A version publishes
# only when the state, every okres, every obec and every katastrální území has its geometry, so a
# killed or incomplete run leaves an inert staged version that any later dispatch resumes.
#
# 10:00 UTC on the 1st is comfortably after the measured generation times (OB_ADR 08:04,
# strukt_ADR 23:43 the prior day). The boundary pack has no vintage in its URL and ČÚZK
# refreshes it in place daily, so a resume never downloads: it restores the vintage's archived
# bytes from R2 and refuses (exit 1) only if they differ from the recorded sha256. A member
# unit ČÚZK dissolves between the month-end CSV and the pack's load day would hold the
# version back with no excuse path (none seen so far), and an obec the pack gives no okres
# stops the load before the mirror moves (`okres_partition`). `registry liveness` in
# `location_town_coverage` goes red when the current version is over 40 days old or a newer
# one has sat staged over 24 h. Everything here is CC BY 4.0 ČÚZK open data — free, no key,
# no registration.
#
# Required secrets: LOCATION_DB_DIRECT_URL (a direct 5432 URL) or SUPABASE_DB_SESSION_URL —
# a registry load wants a session it owns, never the transaction pooler — plus the R2_*
# vars, because the vintage archive (04 §C1.8) is what keeps a past registry_version
# reproducible after ČÚZK rotates the directory, and SUPABASE_DB_URL for the lease below.
#
# The load never runs beside the claim intake (2026-08-10: four heavy location lanes at once
# dropped backends across the shared instance). The intake runs on the job runner, so a
# GitHub group cannot reach it: the load's own main claims the `location-heavy` resource
# through scraper.job_lease (`held_job`), waits as long as an intake run can hold it, and
# exits 1 with nothing loaded if it never got it. The wait counts against this job's 6-hour
# ceiling; a load it cuts stays staged and the next dispatch resumes it (W5, #2033, moves
# the load to the runner).

on:
  workflow_dispatch:
    inputs:
      vintage:
        description: "YYYYMMDD (blank = HEAD-probe the newest published)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "download + parse + assert, write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 10 1 * *"

jobs:
  load:
    runs-on: ubuntu-latest
    concurrency:
      # The design's `registry group`, exclusive — two loads of the same registry_version
      # must never overlap; a second dispatch queues here rather than waiting on the lease.
      group: location-registry
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
      LOCATION_DB_DIRECT_URL: ${{ secrets.LOCATION_DB_DIRECT_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      VINTAGE: ${{ inputs.vintage }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[geo]"

      - name: Run registry load
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$VINTAGE" ]; then ARGS="$ARGS --vintage $VINTAGE"; fi
          echo "python -m location_data.ruian_load $ARGS"
          python -m location_data.ruian_load $ARGS
