name: "Data: seed curated cities"

# Writes the index definitions and one revision of index values from
# data/obce_v_datech_2025.csv into city_index_definitions +
# city_index_revisions + city_index_values, for cities already in
# curated_cities (matched by name and kraj). A row naming no such city, or an
# unknown CSV column, refuses the run by name and writes nothing: a new city
# arrives as a one-line data migration checked against the register. A city's
# population is its town's, loaded by load_obec_population.yml.
#
# Safe to re-run: definitions upsert by index_name, every run inserts a fresh
# city_index_revisions row + matching values batch.
#
# Required secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # the full proximity rebuild: ~975k properties at ~3 ms each, in batches
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run seed
        id: seed
        run: python -m scripts.seed_curated_cities

      # A new index revision shifts the near_{jobs,youth,overall} maxes of every property; the hourly
      # pg_cron run (migration 674) only fills properties not yet computed.
      - name: Rebuild city proximity (full)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python -m scripts.recompute_city_proximity --full
