name: "CI: runner image"

# Builds the job-runner image, the root Dockerfile with EXTRAS=api,browser,clip,geo (CPU torch, the baked CLIP
# checkpoint, the geo wheels, chromium since #2031), on every pull request that changes an image input, before Railway
# first builds it after the merge (#2025): a failure there would leave main unable to build the runner until a fix
# lands. The build's own offline RUN is the CLIP proof (CPU torch, and the checkpoint loads with the hub offline), so
# the scraper files it imports are inputs too; the log then shows the image size. A second job builds the API image
# (EXTRAS=api) at the base and with this pull request, fails if it can import torch or transformers or holds the hub
# cache, and prints both sizes and the package diff (#2032). A third builds the WORKER image (EXTRAS=api,browser).
# Each browser image then runs scripts/browser_image_check.py in the FINISHED image with no network: chromium
# launches, serves a page and closes through the repo's own helper (scraper/browser_fetch.py), so those files are
# inputs too. That arm was missing for the worker, so its first browser build reached Railway unbuilt and failed there
# instead (2026-11-16). No secrets; it pushes and deploys nothing. About 10 minutes a run, billed once the repository
# is private.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "scripts/bake_clip_weights.py"
      - "data/clip_taxonomy.json"
      - "data/requirements-clip-runner.txt"
      - "scraper/__init__.py"
      - "scraper/clip_tagger.py"
      - "scraper/cpus.py"
      - "scraper/browser_fetch.py"
      - "scraper/cgroup.py"
      - "scraper/stop.py"
      - "scripts/browser_image_check.py"
      - "api/wsdp_client.py"
      - ".github/workflows/runner_image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Plain progress keeps the RUN output (the EXTRAS echo, "CLIP baked …", the cache's du) in the log.
      - name: Build the job-runner image
        run: docker build --progress=plain --build-arg EXTRAS=api,browser,clip,geo -t runner-image .

      # The verdict: chromium launches, serves a page and closes through scraper/browser_fetch.py in the FINISHED image,
      # with no network, so a runtime download cannot stand in for the bake. Then one exit IP's session of a full-size
      # ceskereality page (ceskereality_client.PAGES_PER_EXIT_IP) and the memory it held: the walk's sizing (#2031),
      # printed, never a verdict.
      - name: Chromium runs through the browser helper in the finished image, with no network
        run: >-
          docker run --rm --network none -v "$PWD/tests/fixtures:/fixtures:ro" runner-image
          python -m scripts.browser_image_check
          --page /fixtures/location_w2a_refetch/ceskereality_a1.html --pages 250

      - name: Image size
        run: docker image ls runner-image

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The build's own RUN launches chromium, so a build that completes has already proved the bake.
      - name: Build the worker image
        run: docker build --progress=plain --build-arg EXTRAS=api,browser -t worker-image .

      # ... and this proves the FINISHED image kept it, through the repo's own helper: a later layer that
      # drops the browser, or a chromium that only runs because the build host had a library, fails here.
      # No network, so a runtime download cannot stand in for the bake.
      - name: Chromium runs through the browser helper in the finished image, with no network
        run: docker run --rm --network none worker-image python -m scripts.browser_image_check

      - name: Image size
        run: docker image ls worker-image

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The default checkout is the pull request merged into its base, so against the base it differs by this PR
      # alone; the history holds the base commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build the API image at the base and with this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          docker build --progress=plain --build-arg EXTRAS=api -t api-base "$RUNNER_TEMP/base"
          docker build --progress=plain --build-arg EXTRAS=api -t api-head .

      # The verdict: every CLIP line of the Dockerfile sits inside its clip guard.
      - name: The API image holds no torch, transformers or CLIP weights
        run: |
          docker run --rm api-head python -c 'import importlib.util as u; found = [m for m in ("torch", "transformers") if u.find_spec(m)]; assert not found, found'
          docker run --rm api-head sh -c 'test ! -e /root/.cache/huggingface'

      # The ČÚZK client carries a password over stdlib HTTPS and verifies the server against certifi's bundle. A
      # green suite does not prove the image has it: assert it in the finished image, with no network.
      - name: The API image verifies ČÚZK's certificate, against certifi's bundle
        run: |
          docker run --rm --network none api-head python -c 'import os, ssl, certifi; from api import wsdp_client as w; c = w.tls_context(); assert c.verify_mode == ssl.CERT_REQUIRED and c.check_hostname, (c.verify_mode, c.check_hostname); assert os.path.isfile(certifi.where()), certifi.where(); n = len(c.get_ca_certs()); assert n > 50, n; print("WSDP TLS verifies against", n, "authorities from", certifi.where())'

      # Information, not a verdict: a legitimate API dependency or data file must not fail it.
      - name: Sizes and the package diff, base against this pull request
        run: |
          for tag in api-base api-head; do echo "$tag $(docker image inspect -f '{{.Size}}' "$tag") bytes"; done
          docker run --rm api-base pip freeze > "$RUNNER_TEMP/base.txt"
          docker run --rm api-head pip freeze > "$RUNNER_TEMP/head.txt"
          diff "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" && echo "the same packages" || true
