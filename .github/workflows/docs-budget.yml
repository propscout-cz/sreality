name: Docs budget

# Enforces the always-loaded context budgets from CLAUDE.md's Context-discipline rule
# (byte caps on CLAUDE.md/ROADMAP.md/skill bodies that only ratchet down, judged against
# the PR's base; a word cap on skill frontmatter descriptions; routing completeness — every
# .claude/skills/ dir must appear in CLAUDE.md's "Where the detail lives" table) on
# every PR, and warns (non-blocking) when a PR changes code a skill documents without
# touching that skill or when a doc line it adds names a code symbol that exists nowhere
# in the code trees.
#
# No secrets required.

on:
  pull_request:
  merge_group:

jobs:
  docs-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pre-push hook calls this same runner. HEAD^1 is the base this PR's merge commit was
      # built on; origin/<base> moves under a re-run.
      - name: Docs checks
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/docs-check.sh HEAD^1
