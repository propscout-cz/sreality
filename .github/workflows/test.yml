name: "CI: tests"

# CI test suite, runs on every pull request and on every push to main. Three parallel jobs:
# a Python job (verifies the filter-registry and workflow-docs codegen are fresh, runs
# pytest, then lints with ruff), a frontend job (TypeScript type-check + vitest
# pure-function tests) and a secret scan of the new commits. This is the build gate for every branch.
#
# A branch push without a PR runs nothing: a push-triggered twin of the pull_request run
# carried the same check name, and a cancelled twin read as a failed required check.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's run on the PR merged onto main; the queue merges only on these checks.
  merge_group:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes 8–9 min on ubuntu-latest (2026-10-31: 8m12s, 8m22s, 8m23s, 9m03s); at 9 the
    # job was cancelled mid-run on #2212 and read as a failed required check.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The monitoring workflows install `.` alone, with no extra: an import that needs
      # one would turn every one of their runs red, so prove the import here first.
      - name: Import the monitoring entry points with runtime deps only
        run: pip install -e . && python -c "import scripts.verify_pipeline, scripts.record_workflow_failures, scripts.health_canary"

      - name: Install
        id: install
        run: pip install -e ".[dev,api,geo]"

      # -m, not a script path: invoking by path puts scripts/ on sys.path[0] and
      # leaves the repo root off it, so the generator's `from toolkit import ...`
      # resolves through the ambient editable install rather than this checkout.
      # Benign on a clean CI runner, silently wrong on a dev machine whose
      # `pip install -e .` came from a git worktree — same command, different
      # tree. Keep the two invocations identical so local and CI agree.
      - name: Check filter registry codegen is fresh
        run: python -m scripts.generate_filter_registry --check

      - name: Check workflow docs codegen is fresh
        run: python scripts/generate_workflow_docs.py --check

      # The contract-immutability rail. `project()` already refuses a contract whose
      # governed bytes moved under a version on record, but it refuses at DEPLOY time
      # and the projection is one transaction for all nine portals — so one unbumped
      # prose edit takes the whole claim-intake lane down (#1209, 14 consecutive
      # failures from 2026-08-27). Named as its own step so the fix is legible without
      # reading a pytest tail; `tests/location_data/test_contract_immutability.py`
      # asserts the same thing inside the suite.
      - name: Check the portal contract lockfile is fresh
        run: python -m location_data.contract_lock --check

      - name: Run pytest
        run: pytest -q

      # Last, and run even after a failed check above: one run reports lint and tests together.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check --output-format=github .

  vitest:
    # Frontend tests (vitest, jsdom — see frontend/vite.config.ts).
    # Covers filter state plumbing, the registry adapter, the centre+radius
    # spatial helpers in lib/queries, and component behaviour.
    # The `Type-check` step below is load-bearing, not hygiene: it is part (a)
    # of the per-m² rail (CLAUDE.md rule #23) — format.test.ts's
    # `@ts-expect-error` cases fail the BUILD if a basis-blind
    # fmtMeasuredPricePerM2 call ever starts compiling.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run vitest
        working-directory: frontend
        run: npm test

  secrets:
    # gitleaks over exactly the commits this PR (or this push to main) adds, a merge by what it changed beyond the
    # automatic merge, then over the fixtures as they stand, through the one pinned binary the .githooks run too
    # (#2035). GitHub's own secret scanning stops when the repository goes private.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A scan that cannot see a fresh token would pass every PR: prove it still bites before trusting it.
      - name: The scanner finds a planted token
        run: |
          token="ghp_$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          rc=0
          printf 'token = "%s"\n' "$token" | scripts/gitleaks.sh stdin --exit-code 3 || rc=$?
          [ "$rc" = 3 ] || { echo "::error::gitleaks did not report the planted token (exit $rc)"; exit 1; }

      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: scripts/gitleaks.sh git --log-opts="--remerge-diff $RANGE"

      # The commit scan never re-reads a fixture line a scrub left alone, and the fixture census judges the scrub by
      # the scrub's own regex: an independent detector over today's tree catches a key shape both miss.
      - name: The committed fixtures carry no credential
        run: scripts/gitleaks.sh dir tests/fixtures
