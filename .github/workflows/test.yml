name: "CI: tests"

# CI test suite, runs on every pull request and on every push to main. Three parallel jobs:
# a Python job (verifies the filter-registry and workflow-docs codegen are fresh, runs
# pytest, then lints with ruff), a frontend job (the docs budget, then type-check, lint, vitest,
# the production build and its first-visit JS budget) and a secret scan of the new commits. This
# is the build gate for every branch.
#
# A branch push without a PR runs nothing: a push-triggered twin of the pull_request run
# carried the same check name, and a cancelled twin read as a failed required check.

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its superseded run. A push to main gets a group of its own: a shared
# group would drop a queued run even with cancel-in-progress off, and every main run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes 8–9 min on ubuntu-latest (2026-10-31: 8m12s, 8m22s, 8m23s, 9m03s); at 9 the
    # job was cancelled mid-run on #2212 and read as a failed required check.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The monitoring workflows install `.` alone, with no extra: an import that needs
      # one would turn every one of their runs red, so prove the import here first.
      - name: Import the monitoring entry points with runtime deps only
        run: pip install -e . && python -c "import scripts.verify_pipeline, scripts.record_workflow_failures, scripts.health_canary"

      - name: Install
        id: install
        run: pip install -e ".[dev,api,geo]"

      # -m, not a script path: invoking by path puts scripts/ on sys.path[0] and
      # leaves the repo root off it, so the generator's `from toolkit import ...`
      # resolves through the ambient editable install rather than this checkout.
      # Benign on a clean CI runner, silently wrong on a dev machine whose
      # `pip install -e .` came from a git worktree — same command, different
      # tree. Keep the two invocations identical so local and CI agree.
      - name: Check filter registry codegen is fresh
        run: python -m scripts.generate_filter_registry --check

      - name: Check workflow docs codegen is fresh
        run: python scripts/generate_workflow_docs.py --check

      # The contract-immutability rail. `project()` already refuses a contract whose
      # governed bytes moved under a version on record, but it refuses at DEPLOY time
      # and the projection is one transaction for all nine portals — so one unbumped
      # prose edit takes the whole claim-intake lane down (#1209, 14 consecutive
      # failures from 2026-08-27). Named as its own step so the fix is legible without
      # reading a pytest tail; `tests/location_data/test_contract_immutability.py`
      # asserts the same thing inside the suite.
      - name: Check the portal contract lockfile is fresh
        run: python -m location_data.contract_lock --check

      - name: Run pytest
        run: pytest -q

      # Last, and run even after a failed check above: one run reports lint and tests together.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check --output-format=github .

  frontend:
    # Frontend tests (vitest, jsdom — see frontend/vite.config.ts).
    # Covers filter state plumbing, the registry adapter, the centre+radius
    # spatial helpers in lib/queries, and component behaviour.
    # The `Type-check` step below is load-bearing, not hygiene: it is part (a)
    # of the per-m² rail (CLAUDE.md rule #23) — format.test.ts's
    # `@ts-expect-error` cases fail the BUILD if a basis-blind
    # fmtMeasuredPricePerM2 call ever starts compiling.
    runs-on: ubuntu-latest
    # 4-vCPU public runners took about 4 min; a private repo's have 2.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The always-loaded context budgets from CLAUDE.md's Context-discipline rule (byte caps on
      # CLAUDE.md/ROADMAP.md/skill bodies that only ratchet down, judged against the PR's base; a
      # word cap on skill descriptions; routing completeness). HEAD^1 is the base this PR's merge
      # commit was built on; origin/<base> moves under a re-run.
      - name: Enforce context budgets (blocking)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: .github/scripts/docs-budget-check.sh . HEAD^1

      # A design doc or roadmap line naming a function that no longer exists misleads the
      # next session that trusts it. Warns on each backticked symbol the PR's added doc lines
      # name that no code tree contains; never fails (a plan may name what is not built yet).
      - name: Docs name only symbols that exist (non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: .
        run: python3 scripts/docs_symbol_check.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Skill-staleness nudge (non-blocking)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/docs-staleness-check.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Covers the service worker too.
      - name: Type-check
        run: npm run typecheck

      # Rules of Hooks (a runtime React contract tsc can't see). Catches a hook
      # called conditionally / after an early return — the bug that blanked
      # Listing Detail. Errors fail the build; exhaustive-deps stays a warning.
      - name: Lint
        run: npm run lint

      - name: Run vitest
        run: npm test -- --maxWorkers=2

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-only

      # Vite copies public/ into dist/ as-is and Caddy serves these two at fixed
      # URLs with no SPA fallback, so a build without them ships an app that
      # cannot install and a worker URL that 404s.
      - name: Installable shell files are in the build
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest

      - name: All chunk sizes (informational)
        run: |
          du -sh dist
          for f in dist/assets/*.js; do
            sz=$(gzip -c "$f" | wc -c)
            printf '  %-50s %10s bytes gzip\n' "$(basename "$f")" "$sz"
          done

      # BLOCKING. The previous budget summed `index-*.js` alone and called it "what loads
      # before any lazy import", noting maplibre/recharts "only count when their route is
      # opened" — which was false: both were modulepreloaded on every route, so it read
      # ~239 kB and stayed green while a first visit cost ~608 kB. This measures the entry
      # PLUS every preload PLUS their static imports, and fails if either heavy library is
      # back on that path (matched by content, not filename — Rollup renames auto-split
      # chunks). See frontend/scripts/bundle-budget.mjs.
      - name: First-visit JS budget
        run: node scripts/bundle-budget.mjs

  secrets:
    # gitleaks over exactly the commits this PR (or this push to main) adds, a merge by what it changed beyond the
    # automatic merge, then over the fixtures as they stand, through the one pinned binary the .githooks run too
    # (#2035). GitHub's own secret scanning stops when the repository goes private.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A scan that cannot see a fresh token would pass every PR: prove it still bites before trusting it.
      - name: The scanner finds a planted token
        run: |
          token="ghp_$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          rc=0
          printf 'token = "%s"\n' "$token" | scripts/gitleaks.sh stdin --exit-code 3 || rc=$?
          [ "$rc" = 3 ] || { echo "::error::gitleaks did not report the planted token (exit $rc)"; exit 1; }

      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: scripts/gitleaks.sh git --log-opts="--remerge-diff $RANGE"

      # The commit scan never re-reads a fixture line a scrub left alone, and the fixture census judges the scrub by
      # the scrub's own regex: an independent detector over today's tree catches a key shape both miss.
      - name: The committed fixtures carry no credential
        run: scripts/gitleaks.sh dir tests/fixtures
