name: "Scraping: Bezrealitky scraper (pilot)"

# Scheduled (every 6h) + manual scraper for bezrealitky.cz on the shared portal
# framework. Bezrealitky is a JSON-API portal (public GraphQL at
# api.bezrealitky.cz) like sreality: the index walk pages listAdverts and
# enqueues new/price-changed ids into listing_detail_queue, then the detail
# drain fetches advert(id), parses to a ScrapedListing, and writes via
# listing_write.write_listings (the one listing write; new rows land property_id
# NULL and the straggler-attach births the singleton).
#
# WALK ONLY (--index-only, Actions exit W1, #2021): the realtime worker's drain lane fetches what
# the walk enqueues, as it already did for nearly every row (2026-10-23..25: 93% of this
# portal's completions landed outside these runs), so this job no longer drains.
#
# Categories live in the `portals` registry row (migration 110), not here, so
# coverage is tuned with a SQL update, no workflow edit. A scheduled run takes
# no inputs and does a FULL per-category walk (no --max-pages) that ends on the
# API's own last page, so the runner nominates unseen listings for a page check
# (rule #3) — source-scoped to bezrealitky rows only, and the page decides.
#
# Writes an 'index' scrape_runs row under source='bezrealitky' (its own
# Health-page lane; does not touch sreality liveness / reconciliation).
#
# Required secret: SUPABASE_DB_URL. (Coordinates come from the API's gps field,
# so no MAPY_CZ_API_KEY is needed.)
#
# Cadence: every 6h, offset off the other scrapers.

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: cap index pages per category (ad-hoc partial; nominates nothing). Blank = full walk.
        required: false
        default: ""
        type: string
      max_seconds:
        description: wall-clock budget for the walk (default 1500s, under the 30-min job timeout)
        required: false
        default: ""
        type: string

concurrency:
  group: bezrealitky-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run bezrealitky scrape
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # W2a payload archive: bodies live in R2, so a page-fetching lane needs the
          # bucket to archive one. Absent, the append warns and archives NOTHING while
          # the scrape stays green. Inert until payload_dual_write is enabled.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MAX_PAGES: ${{ inputs.max_pages }}
          # Kept under the job's timeout-minutes above: the walk stops and
          # finalizes cleanly on expiry (a recorded, incomplete run) instead of
          # being SIGKILLed with no scrape_runs row. It is also the only
          # unconditional wall-clock rail the offset loop has.
          MAX_SECONDS: ${{ inputs.max_seconds || '1500' }}
        run: |
          ARGS="--index-only --max-seconds $MAX_SECONDS"
          if [ -n "$MAX_PAGES" ]; then ARGS="$ARGS --max-pages $MAX_PAGES"; fi
          echo "python -m scraper.bezrealitky_main $ARGS"
          # exec: a cancel's SIGINT must reach Python, which finalizes the run (#2019), not the shell around it.
          eval "exec python -m scraper.bezrealitky_main $ARGS"
