name: "Scraping: Sreality price stats (ceny-nemovitosti, weekly + manual)"

# Ingests the aggregate market statistics sreality publishes at
# /ceny-nemovitosti (NOT individual listings) into the price_stat_* tables.
# For each active dataset (one named filter set) × tracked municipality ×
# {prodej, pronájem} it fetches the per-month series from the login-gated
# estate_prices JSON API, then recomputes the per-city derived metrics
# (CAGR growth, gross yield) + refreshes the map choropleth. Design:
# docs/design/price-stats-datasets.md.
#
# Auth: estate_prices needs a logged-in Seznam session. A headless Playwright
# login mints the cookie (SREALITY_LOGIN_EMAIL/PASSWORD); a captured
# SREALITY_SESSION_COOKIE bypasses the browser entirely. RUN mode=probe FIRST
# to prove auth works before a full run.
#
# Cadence: one scheduled run a week — the published series is monthly. A run walks
# one queue, stalest first across the active datasets (never-scraped first), until
# its time budget; a run that shrank the never-scraped set chains ONE more run.
#
# Required GitHub secrets:
#   SUPABASE_DB_URL          — same one every workflow uses
#   SREALITY_LOGIN_EMAIL     — Seznam account email (read access to the stats)
#   SREALITY_LOGIN_PASSWORD  — Seznam account password
#   SREALITY_SESSION_COOKIE  — optional; a captured cookie string, skips login

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: probe (test auth) | resolve (refresh localities) | full
        required: true
        default: "full"
        type: choice
        options:
          - "probe"
          - "resolve"
          - "full"
      dataset_id:
        description: Single dataset id to run (empty = all active datasets)
        required: false
        default: ""
        type: string
      start_year:
        description: Earliest year to fetch
        required: false
        default: "2015"
        type: string
      window_years:
        description: CAGR window (years) for the derived growth metrics
        required: false
        default: "5"
        type: string
      dry_run:
        description: Fetch + log but write nothing
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: price-stats
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write   # the chain step dispatches this workflow with the job's own token
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SREALITY_LOGIN_EMAIL: ${{ secrets.SREALITY_LOGIN_EMAIL }}
      SREALITY_LOGIN_PASSWORD: ${{ secrets.SREALITY_LOGIN_PASSWORD }}
      SREALITY_SESSION_COOKIE: ${{ secrets.SREALITY_SESSION_COOKIE }}
      # Login-failure screenshot + HTML land here (scraper/sreality_auth.py),
      # uploaded as an artifact on failure for diagnosing layout changes.
      SREALITY_AUTH_DEBUG_DIR: sreality-auth-debug
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pricestats]"

      - name: Install Chromium for Playwright
        # Only needed when logging in via the browser (no SREALITY_SESSION_COOKIE).
        run: python -m playwright install --with-deps chromium

      - name: Run price-stats ingestion
        id: ingest
        run: |
          MODE='${{ inputs.mode }}'
          if [ -z "$MODE" ]; then MODE="full"; fi   # scheduled run = full

          if [ "$MODE" = "probe" ]; then
            python -m scripts.price_stats_probe
            exit $?
          fi

          ARGS=""
          if [ "$MODE" = "resolve" ]; then ARGS="$ARGS --resolve-only"; fi
          if [ -n "${{ inputs.dataset_id }}" ]; then ARGS="$ARGS --dataset-id ${{ inputs.dataset_id }}"; fi

          SY='${{ inputs.start_year }}'; if [ -z "$SY" ]; then SY="2015"; fi
          WY='${{ inputs.window_years }}'; if [ -z "$WY" ]; then WY="5"; fi
          ARGS="$ARGS --start-year $SY --window-years $WY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          echo "Running with: $ARGS"
          eval python -m scraper.price_stats_main $ARGS

      # One more run, only when this one made progress: the ingestion writes
      # chain=1 when it shrank the never-scraped set and some remains, so a run that
      # covered nothing new never re-triggers and a complete set leaves refresh to
      # the weekly schedule. The job's own GITHUB_TOKEN can dispatch it: GitHub
      # exempts workflow_dispatch from its rule that a GITHUB_TOKEN event starts no
      # new run. Re-dispatch keeps the inputs (dataset_id / window). Skipped for
      # probe / resolve / dry-run.
      #
      # It YIELDS first: the price-stats group keeps one pending slot and GitHub
      # cancels the older pending run, so a dispatch now would silently cancel a
      # waiting Run now click or the Monday schedule. If a run already waits, the
      # chain ends — that run walks the same stalest-first queue. No `${{ }}` in the
      # script: tests/scraper/test_price_stats_chain.py runs this exact text against
      # stub gh and curl.
      - name: Chain next run (only after progress)
        if: ${{ success() && steps.ingest.outputs.chain == '1' && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
          DATASET_ID: ${{ inputs.dataset_id }}
          START_YEAR: ${{ inputs.start_year }}
          WINDOW_YEARS: ${{ inputs.window_years }}
        run: |
          waiting=$(gh run list --workflow=scrape_price_stats.yml --limit 10 --json databaseId,status \
            -q '.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested") | .databaseId' \
            | head -1)
          if [ -n "$waiting" ]; then
            echo "chain yields: run $waiting is already waiting on the price-stats group"
            exit 0
          fi
          if [ -z "$MODE" ]; then MODE="full"; fi
          echo "Progress made, coverage incomplete — re-dispatching (mode=$MODE, dataset=$DATASET_ID)."
          # Capture the HTTP status: the dispatch API returns 204 on success.
          # curl -sS alone returns 0 even on a 4xx, which would let a token without
          # actions: write fail the chain SILENTLY — so check it and fail loud.
          code=$(curl -sS -o /tmp/chain_resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/scrape_price_stats.yml/dispatches" \
            -d "{\"ref\":\"$REF\",\"inputs\":{\"mode\":\"$MODE\",\"dataset_id\":\"$DATASET_ID\",\"start_year\":\"$START_YEAR\",\"window_years\":\"$WINDOW_YEARS\"}}")
          if [ "$code" != "204" ]; then
            echo "::error::Chain re-dispatch failed (HTTP $code). The job's GITHUB_TOKEN needs permissions: actions: write. Response: $(cat /tmp/chain_resp)"
            exit 1
          fi
          echo "Re-dispatch accepted (HTTP 204) — next run is queued."

      - name: Upload login-debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sreality-auth-debug
          path: sreality-auth-debug/
          if-no-files-found: ignore
          retention-days: 5
