name: "Ops: W3 claim purge (last run before migration 699)"

# LAST RUN BEFORE MIGRATION 699; DELETED IN W3's PR-2 (#2223). Dispatched with --ref the W3
# branch. Keeps ONE `location_claims` row per (listing, claim type, licence class), the row
# today's resolver reads (newest contract version <= the active one, then the newest
# observation), and deletes the ≈ 8.8 M others (`scripts.location_claims_retire`). A key whose
# only rows sit under a retired version keeps one; every batch re-counts the KEYS it left and
# stops the run (exit 3) if one is missing. Nothing is enqueued: for 99.97 % of keys the
# keeper is what the resolver reads now, and the RECEIPT names the rest (≈ 2.8 k listings,
# re-mined by W3's rollout step 5).
#
# THREE STEPS when armed, in this order:
#   1. THE BACKUP (rule 1's pg_dump equivalent, ruling Q13): a `\copy` of the WHOLE table to a
#      gzipped CSV, streamed to R2 at backups/w3-claims/<UTC date>/, one object per run attempt
#      (a resumed run never overwrites the first, fuller one), sized before anything is deleted.
#   2. THE PURGE: 2,000 listings a statement, `lock_timeout 5s` + `statement_timeout 120s`,
#      0.5 s between batches; resumable from the logged cursor (`after_listing_id`).
#   3. THE RECEIPT: the collapsed listing ids, gzipped, to R2 beside the backup.
#
# dry_run=true (the default) walks and counts with the same statement and deletes nothing.
# The real purge needs dry_run=false AND confirm=PURGE. A budget-exhausted run exits non-zero
# on purpose: re-dispatch with the cursor it logged.
#
# Required secrets: SUPABASE_DB_URL (SUPABASE_DB_SESSION_URL preferred for the `\copy`), R2_*.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = walk + count only. false = back up, purge, receipt (needs confirm=PURGE)."
        required: false
        default: true
        type: boolean
      confirm:
        description: "Type PURGE to arm the delete. Ignored when dry_run=true."
        required: false
        default: ""
        type: string
      listings_per_batch:
        description: "listings per DELETE statement"
        required: false
        default: "2000"
        type: string
      after_listing_id:
        description: "resume cursor: the listing id the last run logged (0 = from the start)"
        required: false
        default: "0"
        type: string
      max_seconds:
        description: "wall-clock budget; stops between batches, never mid-batch"
        required: false
        default: "20000"
        type: string

concurrency:
  # The shared cross-lane group (see location_registry_load.yml): at most ONE heavy location
  # lane at a time, so the purge never runs beside the hourly intake's GitHub runs.
  group: location-batch
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    concurrency:
      # Two concurrent purges would walk the same keyset. Never cancel in flight: a cancelled
      # batch rolls back whole, and the committed batches are real progress.
      group: location-claims-retire
      cancel-in-progress: false
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_SESSION_URL || secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "15"
      BACKUP: w3_claims_${{ github.run_id }}_${{ github.run_attempt }}.csv.gz
      RECEIPT: w3_purge_receipt_${{ github.run_id }}_${{ github.run_attempt }}.csv.gz
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Guard the real purge
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PURGE" ]; then
            echo "::error::dry_run=false requires confirm=PURGE"
            exit 1
          fi

      # `c.*`, every row: a restorable copy, not a summary. Streamed, never held in memory. The
      # count and the copy share ONE repeatable-read snapshot (the live intake writes meanwhile),
      # and the step fails unless the CSV holds exactly that many records (csv-parsed, not
      # newline-counted: a value may carry a newline).
      - name: Back up the whole table (gzipped CSV), verified against count(*)
        if: ${{ !inputs.dry_run }}
        run: |
          set -o pipefail
          psql -X -q -At -v ON_ERROR_STOP=1 "$DATABASE_URL" > backup_count.txt <<SQL
          begin isolation level repeatable read read only;
          select count(*) from location_claims;
          \copy (select c.* from location_claims c) to program 'gzip > $BACKUP' csv header
          commit;
          SQL
          python3 - "$BACKUP" backup_count.txt <<'PY'
          import csv, gzip, sys
          csv.field_size_limit(sys.maxsize)
          with gzip.open(sys.argv[1], "rt", encoding="utf-8", newline="") as f:
              rows = sum(1 for _ in csv.reader(f)) - 1
          want = int(open(sys.argv[2]).read().split()[0])
          print(f"backup: {rows} rows; the snapshot held {want}")
          sys.exit(0 if rows == want else 1)
          PY
          echo "backup: $(du -h "$BACKUP" | cut -f1) ($(stat -c%s "$BACKUP") bytes)"

      - name: Store the backup in R2
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.backup_before_drop w3-claims --file "$BACKUP"

      - name: Walk + count (delete nothing)
        if: ${{ inputs.dry_run }}
        env:
          LISTINGS: ${{ inputs.listings_per_batch }}
          AFTER: ${{ inputs.after_listing_id }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          python3 -m scripts.location_claims_retire --dry-run \
            --listings-per-batch "$LISTINGS" --after-listing-id "$AFTER" --max-seconds "$MAX_SECONDS"

      - name: Purge in bounded batches
        if: ${{ !inputs.dry_run }}
        env:
          LISTINGS: ${{ inputs.listings_per_batch }}
          AFTER: ${{ inputs.after_listing_id }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          python3 -m scripts.location_claims_retire --confirm PURGE --receipt "$RECEIPT" \
            --listings-per-batch "$LISTINGS" --after-listing-id "$AFTER" --max-seconds "$MAX_SECONDS"

      - name: Store the receipt in R2
        if: ${{ always() && !inputs.dry_run && hashFiles(env.RECEIPT) != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.backup_before_drop w3-claims --file "$RECEIPT"

      # Reported, never asserted: autovacuum reclaims on its own schedule (ruling R7: no VACUUM
      # FULL), and a VACUUM here would be a second heavy statement on a hot table.
      - name: Report what the table looks like afterwards
        if: ${{ !inputs.dry_run }}
        run: |
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "select n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze
               from pg_stat_user_tables where relname = 'location_claims';"
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "select pg_size_pretty(pg_total_relation_size('location_claims')) as total,
                    pg_size_pretty(pg_table_size('location_claims')) as heap;"
