<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The device's cached appearance, on <html> before any CSS paints (lib/theme.ts
         owns it; theme.test.ts runs this copy against the store). A future
         Content-Security-Policy must list this script's sha256, which any edit changes. -->
    <script>
      try {
        const d = document.documentElement, s = localStorage.getItem('sreality.scheme');
        let t = localStorage.getItem('sreality.theme');
        if (s === 'kobalt' || s === 'grafit') d.setAttribute('data-scheme', s);
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch {}
    </script>
    <!-- Pre-hydration fallback only; React's TitleController sets the live
         title from the shared brand (src/lib/brand.ts) on mount. -->
    <title>PropScout.cz</title>
    <!-- Installable shell (Phone app map #1759; iOS facts from #1763). The
         manifest's display: standalone is what makes iOS 16.4-18 open the
         home-screen icon as an app; iOS 26+ does so for any site. theme-color
         is the paper token, light and dark. Status bar stays "default": never
         black-translucent (deprecated; nothing draws under the status bar). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ?v= is a cache-buster: browsers keep a tab icon per URL for days and a reload
         does not refresh it, so the LR to PS swap needed a new URL. Bump it on the next
         icon change. -->
    <link rel="icon" href="/favicon.ico?v=ps" sizes="32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
