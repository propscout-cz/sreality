<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Pre-hydration fallback only; React's TitleController sets the live
         title from the shared brand (src/lib/brand.ts) on mount. -->
    <title>Limen Reality</title>
    <!-- Installable shell (Phone app map #1759; iOS facts from #1763). The
         manifest's display: standalone is what makes iOS 16.4-18 open the
         home-screen icon as an app; iOS 26+ does so for any site. theme-color
         is the paper token, light and dark. Status bar stays "default": never
         black-translucent (deprecated; nothing draws under the status bar). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
